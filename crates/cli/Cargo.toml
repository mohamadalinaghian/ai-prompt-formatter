[package]
name = "pfmt-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pfmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
pfmt-core = { path = "../core" }
pfmt-context = { path = "../context" }
pfmt-llm = { path = "../llm" }
pfmt-history = { path = "../history" }
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
