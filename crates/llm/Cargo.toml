[package]
name = "pfmt-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
pfmt-core = { path = "../core" }
pfmt-context = { path = "../context" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
