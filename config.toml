[budget]
total_ms = 9000
payload_tokens_max = 2500

[llm.writer]
chain = [
    "openai/gpt-oss-120b",
    "qwen/qwen3.8-27b",
    "openai/gpt-oss-20b",
    "google/gemma-4-26b-a4b-it:free",
    "nvidia/nemotron-3.5-lightning:free",
    "google/gemma-4-31b-it:free",
]
api_key_source = "keychain:pfmt-groq"
timeout_ms = 6000

[llm.compactor]
model = "qwen/qwen3.8-27b"

[decider]
provider = "jev"

[stages.gate]
enabled = true
on_fail = "skip"

[stages.verify]
enabled = true
on_fail = "skip"

[stages.history]
enabled = true
on_fail = "skip"

[logs]
retention_days = 30
